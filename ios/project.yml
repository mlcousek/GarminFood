# XcodeGen manifest — the source of truth for the Xcode project structure.
#
# Why this exists instead of a committed .xcodeproj: the owner has no Mac
# (see openspec/config.yaml and add-garmin-auth-and-sync design.md D9), so
# nobody can open Xcode to fix a malformed hand-edited project.pbxproj if
# something goes subtly wrong. A YAML manifest is something an AI agent (or
# a human in any text editor) can safely author and review, and XcodeGen
# deterministically turns it into a valid .xcodeproj on every CI run —
# see .github/workflows/build.yml, which installs XcodeGen and runs
# `xcodegen generate` immediately before `xcodebuild`.
#
# Task 6.4 originally added the widget extension below purely to answer one
# empirical question: does Keychain Sharing (the `keychain-access-groups`
# entitlement) actually get granted between two targets on a FREE Apple ID,
# signed by AltStore rather than paid-account Xcode automatic signing? The
# answer was no (`errSecMissingEntitlement`/-34018, confirmed live, on both
# read and write) — recorded in openspec/config.yaml's Hard Constraints. That
# throwaway spike (formerly GarminFoodWidget/KeychainCheckWidget.swift) and
# its now-nonfunctional `keychain-access-groups` entitlement declarations are
# gone; `add-glanceable-surfaces` replaced them with the real widgets/Controls
# (ios/GarminFoodWidget/) built entirely AROUND that negative result — see
# that change's design.md D1/D2 (REVISED 2026-09-14). Neither target below
# declares any entitlement any more: nothing left in this project asks for
# one (GarminKit's own TokenProvider explicitly never sets
# `kSecAttrAccessGroup` — every process bootstraps its own Garmin login
# independently).
#
# `packages.GarminKit` (added in add-garmin-auth-and-sync tasks 7-11) is the
# local Swift package holding OAuth1 signing, token management, the browser
# bootstrap, and the per-process outbox/reconciliation logic — see
# ios/GarminKit/.
#
# `packages.FoodLogCore` (added in add-food-log-core, tasks 12-16) is the
# local Swift package holding the food-catalog/log-entry DOMAIN layer --
# catalog search adaptation, usage-history ranking, serving-default memory,
# custom foods, meal-type defaulting, and the confirm-and-log orchestration.
# It depends on GarminKit (see FoodLogCore/Package.swift) and is, in turn,
# the only non-UI dependency GarminFood's own SwiftUI views need beyond
# GarminKit itself -- see openspec/config.yaml's "clear module boundaries:
# UI / domain logic / GarminKit networking kept separate" principle. Both
# packages are ALSO declared as dependencies of GarminFoodWidgetExtension
# (added by add-glanceable-surfaces) -- not because the extension is meant
# to call Garmin or touch FoodLogCore's stores while genuinely running as
# the extension (design.md D1/D2 say it never should), but because
# `Shared/QuickPickLoggingIntents.swift` and
# `Shared/OpenBarcodeScannerIntent.swift` (compiled into BOTH targets, per
# each target's `sources` below) import them, and the whole file has to
# compile for every target that includes it -- see those files' own headers.
#
# `GarminFood/Info.plist`'s `NSCameraUsageDescription` (task 14.3) backs the
# VisionKit `DataScannerViewController` barcode-scanning feature -- see
# ios/GarminFood/Catalog/BarcodeScanner.swift. Barcode scanning itself is
# deprioritized (design.md D3) but still requires this key to present the
# camera permission prompt at all.
#
# `GarminFood/Info.plist`'s `CFBundleURLTypes` (added by add-glanceable-surfaces)
# registers the "garminfood" custom URL scheme two DIFFERENT things share
# safely (see Shared/GarminFoodDeepLink.swift's header for why that's safe):
# `ASWebAuthenticationSession`'s own OAuth callback interception
# (GarminKit's `GarminSSOEndpoints.callbackURLScheme`, unconfirmed end to
# end -- see GarminAuthSession.swift), and the static Home Screen/Lock
# Screen widgets' `widgetURL` tap-to-open target, which DOES need this
# registration to reach the app's `onOpenURL(perform:)` handling.
#
# `packages.Gamification` (added by add-gamification) is the local Swift
# package holding the streak/XP/challenge engine -- see ios/Gamification/.
# It depends on FoodLogCore for `UsageEvent` (Gamification/Package.swift).
# Deliberately a dependency of the GarminFood app target ONLY, not of
# GarminFoodWidgetExtension: per that change's proposal.md non-goals,
# gamification state never appears in a widget (a widget cannot read the
# app's local data at all without an App Group -- add-glanceable-surfaces
# design.md D2 -- so there is nothing for it to read there anyway).

name: GarminFood

options:
  bundleIdPrefix: com.mlcousek
  deploymentTarget:
    iOS: "17.0"

packages:
  GarminKit:
    path: GarminKit
  FoodLogCore:
    path: FoodLogCore
  Gamification:
    path: Gamification

settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: "" # signing happens locally via AltStore, not in CI — see D9
    CODE_SIGN_STYLE: Automatic

targets:
  GarminFood:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GarminFood
      - path: Shared
    info:
      path: GarminFood/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSCameraUsageDescription: "GarminFood uses the camera to scan a product barcode and look it up in Garmin's food database."
        CFBundleURLTypes:
          - CFBundleURLName: com.mlcousek.garminfood
            CFBundleURLSchemes:
              - garminfood
        CFBundleIconName: AppIcon
        # add-app-icon-picker (2026-09-22): the 5 alternates are loose PNG
        # pairs (`GarminFood/AppIcons/<Name>@2x.png`/`@3x.png`, iPhone-only
        # per this target's TARGETED_DEVICE_FAMILY, so no ~ipad sizes) --
        # NOT asset-catalog imagesets. This is the classic, stable
        # CFBundleAlternateIcons mechanism `setAlternateIconName` has used
        # since iOS 10.3, kept deliberately separate from `CFBundleIconName`
        # above (which stays asset-catalog-driven for the primary icon only,
        # unchanged) -- confirmed via Apple's own setAlternateIconName docs
        # and cross-checked against a second independent source
        # (nemecek.be/blog/114/implementing-alternate-icons-in-ios) since
        # there is no local Xcode to test a wrong guess against; an Info.plist
        # key typo wouldn't fail `xcodebuild` in CI, only silently fail to
        # switch icons on a real device.
        CFBundleIcons:
          CFBundleAlternateIcons:
            AppIcon-Streak:
              CFBundleIconFiles:
                - AppIcon-Streak
              UIPrerenderedIcon: false
            AppIcon-Macro:
              CFBundleIconFiles:
                - AppIcon-Macro
              UIPrerenderedIcon: false
            AppIcon-Midnight:
              CFBundleIconFiles:
                - AppIcon-Midnight
              UIPrerenderedIcon: false
            AppIcon-Mint:
              CFBundleIconFiles:
                - AppIcon-Mint
              UIPrerenderedIcon: false
            AppIcon-Pastel:
              CFBundleIconFiles:
                - AppIcon-Pastel
              UIPrerenderedIcon: false
        # add-garmin-auth-and-sync 9.5 / BackgroundRefresh.swift: delivers
        # queued entries while the app isn't open. The identifier must match
        # BackgroundRefresh.identifier exactly, or BGTaskScheduler.submit
        # throws at runtime.
        UIBackgroundModes:
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.mlcousek.garminfood.refresh
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlcousek.garminfood
        TARGETED_DEVICE_FAMILY: "1" # iPhone only, for now
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
    dependencies:
      - target: GarminFoodWidgetExtension
        embed: true
      - package: GarminKit
      - package: FoodLogCore
      - package: Gamification
    scheme:
      testTargets: []
      gatherCoverageData: false

  GarminFoodWidgetExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: GarminFoodWidget
      - path: Shared
    info:
      path: GarminFoodWidget/Info.plist
      properties:
        CFBundleDisplayName: GarminFood Widget
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mlcousek.garminfood.widget
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: true
    dependencies:
      - package: GarminKit
      - package: FoodLogCore
