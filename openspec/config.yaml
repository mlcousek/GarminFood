schema: spec-driven

context: |
  GarminFood — a personal iOS app for logging food in two taps and having it
  land in Garmin Connect.

  ## Why this project exists

  Garmin shipped native nutrition tracking in Connect+ in January 2026, but it
  is buried several taps deep inside the Connect app and has no iOS widget. The
  goal is Yazio-grade entry speed (lock screen, Control Center, Siri) with
  Garmin Connect as the system of record, so consumed calories sit next to
  burned calories in the same place as every other metric.

  ## Owner context

  Single user, single Garmin account, iPhone + Apple Watch, Czech-speaking
  (food search must work for Czech products, not just US ones). Already runs a
  substantial Obsidian vault with a working Garmin sync pipeline in Node
  (scripts/lib/garmin.mjs) that this project deliberately reuses rather than
  reinvents.

  ## Hard constraints

  - Garmin has NO public write API for nutrition. The Health API is read-only
    for partners; nutrition writes are not offered at all. Everything here
    rides Garmin's private mobile API (connectapi.garmin.com), which is
    undocumented, unversioned, and outside Garmin's terms of use. This is
    personal-use interop with the owner's own account and own data.
  - Garmin put its SSO login endpoints behind Cloudflare bot protection in
    March 2026. Scripted login is dead; `garth` was deprecated the same month.
    Tokens can only be obtained through a real browser session. Any design that
    assumes username/password login is already broken.
  - The OAuth1 token lasts roughly one year and is the only thing that can mint
    OAuth2 access tokens. Losing it means a manual re-bootstrap, not a crash
    loop. Treat re-bootstrap as a normal, expected maintenance event.
  - Private-API routes change without notice. Every endpoint this project
    depends on must be recorded with the date it was last observed working, so
    a future failure can be told apart from a mistaken URL.
  - No paid Apple Developer Program membership for now (owner's decision,
    2026-09-14): ship on a free Personal Team, distributed via AltStore/
    SideStore with its automatic 7-day resign, not manual Xcode reinstalls
    (which would wipe local data and Keychain items every week instead of
    just re-signing the same binary in place). A free Personal Team CANNOT
    use App Groups, Push Notifications, iCloud or HealthKit. **Confirmed
    2026-09-14: a custom Keychain Sharing group is blocked too** —
    `errSecMissingEntitlement` (-34018) on a live device test, on both the
    write and read side. This rules out any shared state at all (file
    container or Keychain) between the app and its widget/Control
    extensions — every process bootstraps its own Garmin login
    independently (see add-garmin-auth-and-sync design.md D3/D4). Also
    confirmed: AltStore enforces a ~10-new-App-ID-per-week quota (every
    app and every extension consumes one) — pace new targets accordingly.
    Revisit paying $99/yr once the free-tier ceiling is felt in
    practice (most likely: push-based widget updates, or App-Group-shared
    local storage becoming worth the friction).
  - The owner has no Mac (confirmed 2026-09-14). Xcode is macOS-only and
    cannot be substituted — this is an unavoidable Apple platform reality,
    not a preference. The build step therefore runs on GitHub Actions'
    hosted macOS runners rather than locally. This repository is public,
    which makes macOS runner minutes free and unlimited (GitHub's 10x
    minute multiplier only affects private-repo quotas). Deployment to a
    physical iPhone happens via AltServer for Windows (or Sideloadly),
    both of which sideload a built .ipa from a Windows machine without
    ever needing a Mac. Combined with the free-tier decision above, the
    whole loop -- write code, build, sign, install, use -- runs at $0 and
    without owning Apple hardware beyond an iPhone. Trade-off, stated
    plainly: no local Xcode means no SwiftUI live previews, no interactive
    debugger, no Instruments profiling -- iteration is edit-push-wait-for-
    CI-sideload, not edit-and-immediately-see. Code-signing a free Apple ID
    headlessly in CI (no interactive Xcode ever touches this account) is
    also less traveled than the Xcode-GUI-assisted path and needs its own
    spike, not an assumption that it "just works" the way it does when a
    human clicks through Xcode's automatic-signing UI once.

  ## Ground truth established by probing (2026-09-14)

  Run against the owner's live account, read-only, with the existing OAuth1
  token. These are observations, not assumptions:

  - Auth works. OAuth1 -> OAuth2 exchange at
    POST /oauth-service/oauth/exchange/user/2.0 returns a ~24h access token.
  - GET /nutrition-service/food/search?searchExpression=<term> returns 200 with
    real data. Garmin's food database is FatSecret-backed. Results carry
    foodId, foodName, foodType, source, regionCode, languageCode, several
    nutritionContents entries (servingId, servingUnit, numberOfUnits, calories,
    carbs, protein, fat, fiber, sugar, saturatedFat, cholesterol, sodium,
    potassium, vitaminA, vitaminC, calcium, iron), plus isFavorite, isRecent,
    servingQty and logTimestamp.
  - Czech terms return results (`rohlik` -> 13 hits), so the database is not
    US-only. regionCode/languageCode are NOT accepted as query parameters.
  - GET /usersummary-service/usersummary/daily?calendarDate=<d> exposes
    consumedKilocalories and remainingKilocalories. Currently null — nothing
    has ever been logged on this account. This is the field the whole project
    is trying to populate.
  - The food-LOG read and write routes are still unknown. Every guessed path
    (/food/log/date/{d}, /diary/{d}, /food/favorite, /food/recent, ...) returns
    404. Note this means the vault's existing getNutritionLog() has been
    silently returning null into its catch block since the day it was written.

  ## Conventions

  - Local-first. A food entry is saved to the device store and shown to the
    user before any network call. Garmin is a sync target, never a blocking
    dependency. The UI must never wait on connectapi.garmin.com.
  - Every Garmin route is recorded in one place with its last-verified date and
    observed status codes. Undocumented guesses do not ship.
  - Failures degrade, they do not crash — except auth failure, which must be
    loud and actionable ("sign in again"), because silent auth failure is how
    the vault's nutrition sync went unnoticed.
  - Rate limiting is respected: honour Retry-After, back off exponentially, and
    treat 429 as "stop and resume later", not "retry harder".

  ## Design & UX principles (owner decision, 2026-09-14)

  This is not meant to be a bare-functional tool. It should feel like a
  genuinely well-made, modern iOS app — closer to a small indie app with a
  point of view than a personal utility script with a UI bolted on. This
  governs every change that touches UI, not just the ones that mention it.

  - SwiftUI throughout, idiomatic and current — no UIKit fallbacks except
    where a framework genuinely requires it (VisionKit's scanner, e.g.).
  - Motion and feedback are not an afterthought: meaningful transitions,
    haptics on confirm/level-up/streak milestones, and states (loading,
    empty, error, success) are designed on purpose, not left as whatever
    SwiftUI does by default.
  - A small, consistent design system (color, type scale, spacing,
    component set) defined once and reused everywhere, not per-screen
    improvisation. Support Dynamic Type and both light and dark mode from
    the start, not retrofitted later.
  - Accessibility is a baseline, not a stretch goal: VoiceOver labels,
    sufficient contrast, Reduce Motion respected.
  - Code quality matches the UI ambition: clear module boundaries (UI /
    domain logic / GarminKit networking kept separate, not entangled),
    previewable SwiftUI views, and logic that's testable without a device
    where feasible. "Best practices" means idiomatic Swift and SwiftUI
    conventions, not maximal abstraction for its own sake.
  - Playful and encouraging in tone (the gamification layer especially),
    but never at the cost of clarity — a streak flame or a level-up
    animation should never obscure whether an action actually succeeded.
  - This is a live, evolving product, not a fixed feature list — "lots of
    add-ons" over time is expected. Favor an architecture (small,
    composable views; a domain layer that doesn't assume today's feature
    set is final) that makes adding the next thing cheap, over building
    every conceivable feature now.

rules:
  proposal:
    - Always include a "## Non-goals" section naming which other change owns excluded work.
    - State "**Depends on**:" and "**Unblocks**:" in "## Impact" so ordering is explicit.
  specs:
    - Requirements describe observable behaviour, not implementation detail.
    - Any requirement that depends on an undocumented Garmin route must name the route and its last-verified date.
    - A scenario that cannot fail is not a scenario.
  design:
    - Record what was probed, what answered, and on what date — evidence over assertion.
    - Name the fallback for every private-API dependency, because they will break.
  tasks:
    - A task that probes a live endpoint must record the observed status code and payload shape.
    - Never include a task that writes to the Garmin account before the write contract is documented.
