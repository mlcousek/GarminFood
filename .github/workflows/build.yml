# Build the iOS app on GitHub's hosted macOS runners.
#
# Why this exists: the owner has no Mac (see openspec/config.yaml and
# add-garmin-auth-and-sync design.md D9). Xcode only runs on macOS, so this
# repo's build step lives in CI instead of on a local machine. This repo is
# public, so macOS runner minutes are free and unlimited — the usual 10x
# minute-multiplier only applies to private-repo quotas.
#
# This is task 6.1 (Simulator build, proves the basic loop works) and 6.2
# (an unsigned device archive, packaged as an unsigned .ipa artifact).
#
# CI does NOT sign anything, and this is deliberate, not an unfinished spike:
# fastlane's cert/sigh have never supported free/personal-team Apple IDs
# (unresolved on fastlane's own tracker since 2017) -- free-tier signing
# runs through a private Xcode-GUI-only flow with no API surface to drive
# from CI. See add-garmin-auth-and-sync design.md D9's revision. Signing
# happens locally instead, via AltServer for Windows + AltStore on the
# device (same tool used for the ongoing 7-day resign cycle -- see D8),
# with the owner's Apple ID typed directly into AltServer's own window --
# it never exists as a secret anywhere in this project's infrastructure.

name: Build iOS app

on:
  push:
    branches: ["**"]
    paths:
      - "ios/**"
      - ".github/workflows/build.yml"
      - "tools/check-localizations.mjs"
      - "tools/lint-design-tokens.sh"
      - "tools/design-token-allowlist.txt"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/build.yml"
      - "tools/check-localizations.mjs"
      - "tools/lint-design-tokens.sh"
      - "tools/design-token-allowlist.txt"
  workflow_dispatch: {}

jobs:
  localization:
    # add-localization design.md D9.1: every catalog / package .lproj is
    # hand-authored (no Mac, so no Xcode String Catalog editor), and a
    # missing Czech string or a "%d" where Swift generates "%lld" fails
    # nothing else -- it just shows English on the phone. This job turns
    # those into a red check. Plain Node on Linux: seconds, no macOS minutes.
    # `--scan` only REPORTS untranslated SwiftUI literals (the backlog); it
    # never fails the job.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check translations
        run: node tools/check-localizations.mjs --scan

  build:
    runs-on: macos-latest
    defaults:
      run:
        working-directory: ios

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Show Xcode + Swift versions
        run: |
          xcodebuild -version
          swift --version

      - name: Compile String Catalogs with xcstringstool (non-blocking)
        # add-localization design.md D9.2: proves each hand-written
        # .xcstrings compiles with Apple's own tool, and prints the Czech
        # output. NON-BLOCKING until one green run confirms the CLI flags
        # (xcstringstool's usage isn't publicly documented; `--help` is
        # printed first so a failure is diagnosable from the log) -- then
        # drop `continue-on-error` (tasks.md 1.9).
        continue-on-error: true
        run: |
          set -e
          xcrun xcstringstool compile --help || true
          for f in GarminFood/Resources/Localizable.xcstrings GarminFoodWidget/Resources/Localizable.xcstrings; do
            out="build/xcstrings/${f%%/*}"
            mkdir -p "$out"
            xcrun xcstringstool compile "$f" --output-directory "$out"
          done
          find build/xcstrings -type f | sort
          for s in build/xcstrings/*/cs.lproj/*; do echo "== $s"; plutil -p "$s"; done

      - name: Run GarminKit unit tests
        # Pure logic (OAuth1 signing, outbox, reconciliation) -- no simulator
        # or signing needed, and it's the fastest possible signal on the
        # package by itself before it's even part of the app build.
        run: |
          cd GarminKit
          swift test

      - name: Run FoodLogCore unit tests
        # Pure domain logic (quick-pick ranking, serving-default memory,
        # meal-type-from-time-of-day defaulting, catalog search adaptation,
        # barcode normalisation, the confirm-and-log coordinator) -- same
        # rationale as the GarminKit step above. This package depends on
        # GarminKit via a local path dependency (FoodLogCore/Package.swift),
        # which SwiftPM resolves automatically.
        run: |
          cd FoodLogCore
          swift test

      - name: Run Gamification unit tests
        # Pure logic (streak grace-rule, level-from-XP curve, challenge
        # completion conditions) -- same rationale as the GarminKit/
        # FoodLogCore steps above. This package depends on FoodLogCore via a
        # local path dependency (Gamification/Package.swift), which SwiftPM
        # resolves automatically.
        run: |
          cd Gamification
          swift test

      - name: Run AppearanceKit unit tests
        # Pure logic (color math, WCAG contrast and OKLab distinctness policy
        # over every built-in theme, palette resolution, settings decoding) --
        # same rationale as the steps above. Dependency-free (Foundation only).
        run: |
          cd AppearanceKit
          swift test

      - name: Lint design tokens
        # add-themes-and-layout D12: views use Theme tokens, never literal
        # colors (exemptions, each with a reason, in
        # tools/design-token-allowlist.txt). Before the slow Xcode steps so
        # it fails fast.
        run: sh ../tools/lint-design-tokens.sh

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project from project.yml
        run: xcodegen generate

      - name: List available iOS Simulators
        run: xcrun simctl list devices available | grep -i iphone | head -5

      - name: Build for iOS Simulator (no code signing needed)
        run: |
          xcodebuild build \
            -project GarminFood.xcodeproj \
            -scheme GarminFood \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO

      - name: Archive for a real device, unsigned
        run: |
          xcodebuild archive \
            -project GarminFood.xcodeproj \
            -scheme GarminFood \
            -destination 'generic/platform=iOS' \
            -archivePath build/GarminFood.xcarchive \
            -configuration Release \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO

      - name: Package the archive as an unsigned .ipa
        # An .ipa is just Payload/<AppName>.app zipped up. Signing happens
        # locally via AltServer/AltStore on the owner's Windows machine, never here
        # -- see the header comment above and design.md D9.
        run: |
          set -e
          APP_PATH="build/GarminFood.xcarchive/Products/Applications/GarminFood.app"
          if [ ! -d "$APP_PATH" ]; then
            echo "::error::Expected app bundle not found at $APP_PATH"
            find build/GarminFood.xcarchive -maxdepth 4
            exit 1
          fi
          mkdir -p build/Payload
          cp -R "$APP_PATH" build/Payload/
          cd build && zip -r -q GarminFood-unsigned.ipa Payload
          cd .. && ls -la build/GarminFood-unsigned.ipa

      - name: Upload unsigned .ipa artifact
        uses: actions/upload-artifact@v4
        with:
          name: GarminFood-unsigned-ipa
          path: ios/build/GarminFood-unsigned.ipa
          retention-days: 14

      - name: Show the app's compiled localizations (non-blocking)
        # add-localization tasks.md 1.9: evidence that Xcode compiled the app
        # and widget catalogs AND the packages' .lproj resources into the
        # shipped bundle -- the Czech .strings/.stringsdict printed here are
        # exactly what the phone will read.
        continue-on-error: true
        run: |
          APP="build/GarminFood.xcarchive/Products/Applications/GarminFood.app"
          find "$APP" -name "*.lproj" -maxdepth 4 | sort
          find "$APP" -path "*cs.lproj/*" \( -name "*.strings" -o -name "*.stringsdict" \) | while read -r f; do
            echo "== $f"; plutil -p "$f"
          done

      - name: Export localizations (compiler-extracted keys, non-blocking)
        # add-localization design.md D9.2: the authoritative list of every
        # localizable key the Swift compiler actually produced (exact
        # "%lld"/"%@" specifiers), as an .xcloc -- what translation work on
        # Windows is checked against, since nobody can run Xcode's catalog
        # sync here. Last in the job so it never delays the .ipa artifact.
        continue-on-error: true
        run: |
          xcodebuild -exportLocalizations \
            -project GarminFood.xcodeproj \
            -localizationPath build/l10n-export \
            -exportLanguage cs \
            CODE_SIGNING_ALLOWED=NO
          find build/l10n-export -maxdepth 4 | sort | head -80

      - name: Upload localization export
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: GarminFood-localizations-cs
          path: ios/build/l10n-export
          if-no-files-found: warn
          retention-days: 14
